<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 900 1300">
  <defs>
    <pattern id="gingham" width="54" height="54" patternUnits="userSpaceOnUse">
      <rect width="54" height="54" fill="#f7e6df"/>
      <rect width="27" height="27" fill="#c94a4b" opacity=".18"/>
      <rect x="27" y="27" width="27" height="27" fill="#c94a4b" opacity=".18"/>
      <path d="M0 0H54M0 27H54M0 0V54M27 0V54" stroke="#b83b42" stroke-width="2" opacity=".3"/>
    </pattern>
    <pattern id="paper" width="9" height="9" patternUnits="userSpaceOnUse">
