      <path d="M-3 -19 Q-14 -28 -20 -21 Q-9 -20 -3 -15 Q-1 -24 7 -28 Q7 -18 2 -14 Q14 -21 18 -15 Q7 -12 2 -12Z" fill="#557743"/>
