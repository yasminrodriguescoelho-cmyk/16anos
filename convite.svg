        <ellipse cx="-10" cy="7" rx="1.6" ry="2.4"/><ellipse cx="1" cy="5" rx="1.6" ry="2.4"/><ellipse cx="8" cy="14" rx="1.6" ry="2.4"/>
        <ellipse cx="-3" cy="17" rx="1.6" ry="2.4"/>
      </g>
    </g>
    <g id="flower">
