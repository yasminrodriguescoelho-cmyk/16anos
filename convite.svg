  <rect x="38" y="38" width="824" height="1224" rx="7" fill="url(#paper)" stroke="#fffdf4" stroke-width="8"/>
  <rect x="57" y="57" width="786" height="1186" fill="none" stroke="#c94a4b" stroke-width="2" stroke-dasharray="5 8" opacity=".65"/>
