    <text x="450" y="790" font-size="31" font-weight="bold" fill="#5d7844">📍 Local: coloque o endereço</text>
    <text x="450" y="842" font-size="31" font-weight="bold" fill="#5d7844">🕗 Horário: coloque o horário</text>
    <text x="450" y="894" font-size="31" font-weight="bold" fill="#5d7844">🍓 Data: coloque a data</text>
    <text x="450" y="985" font-size="30" font-style="italic" fill="#8d2531">Sua presença vai deixar meu dia</text>
    <text x="450" y="1028" font-size="30" font-style="italic" fill="#8d2531">ainda mais doce!</text>
    <text x="450" y="1120" font-size="48" font-weight="bold" fill="#b52d36">♡ Te espero! ♡</text>
