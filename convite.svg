      <ellipse cx="-80" cy="-12" rx="67" ry="86" fill="url(#balloon)" stroke="#9b1727" stroke-width="5"/>
      <ellipse cx="-98" cy="-44" rx="12" ry="31" fill="#fff" opacity=".45" transform="rotate(20 -98 -44)"/>
      <ellipse cx="76" cy="-12" rx="75" ry="86" fill="url(#balloon)" stroke="#9b1727" stroke-width="5"/>
      <ellipse cx="54" cy="-43" rx="13" ry="31" fill="#fff" opacity=".42" transform="rotate(20 54 -43)"/>
      <text x="-80" y="20" font-size="116" font-weight="bold" fill="#fff5ed" stroke="#8e1223" stroke-width="2">1</text>
      <text x="76" y="20" font-size="116" font-weight="bold" fill="#fff5ed" stroke="#8e1223" stroke-width="2">6</text>
    </g>
    <text x="450" y="525" font-size="92" font-weight="bold" fill="#b52d36" letter-spacing="8">anos</text>
    <path d="M205 555 Q450 580 695 555" stroke="#5d7844" stroke-width="3" fill="none"/>
    <text x="450" y="650" font-size="43" font-weight="bold" fill="#861e2b">Você está oficialmente</text>
